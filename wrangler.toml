name = "vibelist"
main = "worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
PRO_PRICE_LABEL = "€2.99"
CLAUDE_MODEL = "claude-haiku-5-5"

# Opcional: límite diario de la IA Pro por suscripción.
# Crea el KV con `npx wrangler kv namespace create USAGE` y descomenta:
# [[kv_namespaces]]
# binding = "USAGE"
# id = "<id que te da wrangler>"
